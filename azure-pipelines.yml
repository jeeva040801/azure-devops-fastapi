trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

stages:

# =========================
# BUILD + TRAIN + TEST
# =========================
- stage: BuildAndTest
  displayName: Build, Train and Test

  jobs:
  - job: BuildJob
    displayName: Build ML Application

    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install Dependencies

    - script: |
        python train.py
      displayName: Train Linear Regression Model

    - script: |
        ls -la
      displayName: Verify model.pkl exists

    - script: |
        pytest
      displayName: Run Unit Tests

    - task: ArchiveFiles@2
      displayName: Create Deployment Package
      inputs:
        rootFolderOrFile: '$(Build.SourcesDirectory)'
        includeRootFolder: false
        archiveType: zip
        archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
        replaceExistingArchive: true

    - task: PublishBuildArtifacts@1
      displayName: Publish Artifact
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)/app.zip'
        ArtifactName: 'drop'

# =========================
# DEPLOY TO DEV
# =========================
- stage: DeployDev
  displayName: Deploy to Development
  dependsOn: BuildAndTest

  jobs:
  - deployment: DeployDev
    environment: dev

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to Dev App Service
            inputs:
              azureSubscription: 'azure-service-connection'
              appType: 'webAppLinux'
              appName: 'fastapi-devops-app'
              package: '$(Pipeline.Workspace)/drop/app.zip'

# =========================
# DEPLOY TO PROD
# =========================
- stage: DeployProduction
  displayName: Deploy to Production
  dependsOn: DeployDev

  jobs:
  - deployment: DeployProd
    environment: production

    strategy:
      runOnce:
        deploy:
          steps:

          - download: current
            artifact: drop

          - task: AzureWebApp@1
            displayName: Deploy to Production App Service
            inputs:
              azureSubscription: 'azure-service-connection'
              appType: 'webAppLinux'
              appName: 'fastapi-devops-app'
              package: '$(Pipeline.Workspace)/drop/app.zip'
